<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>POP登録</title>
</head>

<script src="https://unpkg.com/@zxing/browser@latest"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {

        const scanButton = document.getElementById("scanButton");
        const barcodeInput = document.getElementById("barcode");

        scanButton.addEventListener("click", async () => {

            const codeReader = new ZXingBrowser.BrowserMultiFormatReader();

            try {
                const result = await codeReader.decodeOnceFromVideoDevice(
                    undefined,
                    "barcodeReader"
                );

                barcodeInput.value = result.text;

            } catch (error) {
                console.error(error);
                alert("バーコードを読み取れませんでした。");
            }

        });

    });
</script>

</body>

<h1>コンビニPOP撤去ナビゲーター</h1>

<h2>POP登録</h2>

<form method="POST" enctype="multipart/form-data">

    <label>POP名</label><br>
    <input type="text" name="pop_name" placeholder="例：メロンパン20円引き">
    <br><br>

    <label>JANコード</label><br>

    <input type="text" id="barcode" name="barcode" placeholder="バーコードを読み取ると入力されます">

    <br>

    <button type="button" id="scanButton">
        📷 バーコードを読み取る
    </button>

    <br><br>

    <video id="barcodeReader" width="100%" autoplay></video>

    <label>設置場所</label>

    <select name="location" required>
        <option value="">選択してください</option>
        <option value="レジ周辺">レジ周辺</option>
        <option value="冷蔵ケース">冷蔵ケース</option>
        <option value="冷凍ケース">冷凍ケース</option>
        <option value="菓子・食品棚">菓子・食品棚</option>
        <option value="飲料コーナー">飲料コーナー</option>
        <option value="店頭">店頭</option>
        <option value="その他">その他</option>
    </select>
    <br><br>

    <label>撤去期限</label><br>
    <input type="date" name="expire_date">
    <br><br>

    <label>POP写真</label><br>
    <input type="file" name="image" accept="image/*" capture="environment">
    <br><br>

    <button type="submit">登録</button>

</form>

<nav>
    <a href="/">🏠 ホーム</a>
    <a href="/list">📋 POP一覧</a>
    <a href="/register">➕ POP登録</a>
    <a href="/remove">📷 撤去確認</a>
</nav>

</body>

</html>
