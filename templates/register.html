<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>POP登録</title>

    <style>
        /* JANあり・なし選択 */
        .jan-choice {
            display: flex;
            gap: 12px;
            margin: 15px 0 20px 0;
        }

        .jan-choice label {
            flex: 1;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            background-color: #fff;
        }

        .jan-choice input {
            display: none;
        }

        .jan-choice label.selected {
            border-color: #333;
            background-color: #eee;
        }

        /* JAN入力エリア */
        #barcodeArea {
            margin-bottom: 20px;
        }
    </style>

</head>

<body>

    <h1>コンビニPOP撤去ナビゲーター</h1>

    <h2>POP登録</h2>


    <form method="POST" enctype="multipart/form-data">


        <!-- ============================== -->
        <!-- JANあり・なし -->
        <!-- ============================== -->

        <label>JANコードの有無</label>

        <div class="jan-choice">

            <label id="janYesLabel" class="selected">

                <input type="radio" name="has_barcode" value="yes" checked>

                JANあり

            </label>


            <label id="janNoLabel">

                <input type="radio" name="has_barcode" value="no">

                JANなし

            </label>

        </div>


        <!-- ============================== -->
        <!-- POP名 -->
        <!-- ============================== -->

        <label>POP名</label>
        <br>

        <input type="text" name="pop_name" placeholder="例：メロンパン20円引き" required>

        <br><br>


        <!-- ============================== -->
        <!-- JANコード -->
        <!-- ============================== -->

        <div id="barcodeArea">

            <label>JANコード</label>
            <br>

            <input type="text" id="barcode" name="barcode" placeholder="バーコードを読み取ると入力されます">

            <br>

            <button type="button" id="scanButton">
                📷 バーコードを読み取る
            </button>

            <br><br>

            <video id="barcodeReader" width="100%" autoplay></video>

        </div>


        <!-- ============================== -->
        <!-- 設置場所 -->
        <!-- ============================== -->

        <label>設置場所</label>

        <br>

        <select name="location" required>

            <option value="">選択してください</option>

            <option value="レジ周辺">レジ周辺</option>

            <option value="冷蔵ケース">冷蔵ケース</option>

            <option value="冷凍ケース">冷凍ケース</option>

            <option value="菓子・食品棚">菓子・食品棚</option>

            <option value="飲料コーナー">飲料コーナー</option>

            <option value="店頭">店頭</option>

            <option value="その他">その他</option>

        </select>

        <br><br>


        <!-- ============================== -->
        <!-- 撤去期限 -->
        <!-- ============================== -->

        <label>撤去期限</label>

        <br>

        <input type="date" name="expire_date" required>

        <br><br>


        <!-- ============================== -->
        <!-- POP写真 -->
        <!-- ============================== -->

        <label>POP写真</label>

        <br>

        <input type="file" name="image" accept="image/*" capture="environment">

        <br><br>


        <button type="submit">
            登録
        </button>


    </form>


    <!-- ============================== -->
    <!-- ナビゲーション -->
    <!-- ============================== -->

    <nav>

        <a href="/">
            🏠 ホーム
        </a>

        <a href="/list">
            📋 POP一覧
        </a>

        <a href="/remove">
            📷 撤去確認
        </a>

    </nav>


    <!-- ZXing -->
    <script src="https://unpkg.com/@zxing/browser@latest"></script>


    <script>

        document.addEventListener("DOMContentLoaded", () => {


            const janYesLabel =
                document.getElementById("janYesLabel");

            const janNoLabel =
                document.getElementById("janNoLabel");


            const barcodeArea =
                document.getElementById("barcodeArea");


            const scanButton =
                document.getElementById("scanButton");


            const barcodeInput =
                document.getElementById("barcode");


            // --------------------------------
            // JANあり・なしの切り替え
            // --------------------------------

            function updateJanArea() {

                const selected =
                    document.querySelector(
                        'input[name="has_barcode"]:checked'
                    ).value;


                if (selected === "yes") {

                    barcodeArea.style.display = "block";

                    janYesLabel.classList.add("selected");

                    janNoLabel.classList.remove("selected");

                } else {

                    barcodeArea.style.display = "none";

                    janYesLabel.classList.remove("selected");

                    janNoLabel.classList.add("selected");

                    barcodeInput.value = "";

                }

            }


            janYesLabel.addEventListener(
                "click",
                updateJanArea
            );


            janNoLabel.addEventListener(
                "click",
                updateJanArea
            );


            // 初期状態
            updateJanArea();


            // --------------------------------
            // バーコード読み取り
            // --------------------------------

            scanButton.addEventListener(
                "click",
                async () => {

                    const codeReader =
                        new ZXingBrowser.BrowserMultiFormatReader();


                    try {

                        const result =
                            await codeReader.decodeOnceFromVideoDevice(
                                undefined,
                                "barcodeReader"
                            );


                        barcodeInput.value =
                            result.text;


                    } catch (error) {

                        console.error(error);

                        alert(
                            "バーコードを読み取れませんでした。"
                        );

                    }

                }
            );

        });

    </script>

</body>

</html>
