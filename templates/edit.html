<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>POP編集</title>
</head>

<body>

    <h1>コンビニPOP撤去ナビゲーター</h1>

    <h2>POP編集</h2>

    <form method="POST">

        <label>POP名</label>
        <input type="text" name="pop_name" value="{{ pop['pop_name'] }}" required>

        <label>JANコード</label>
        <input type="text" name="barcode" value="{{ pop['barcode'] }}" required>

        <label>設置場所</label>

        <select name="location" required>
            <option value="">選択してください</option>
            <option value="レジ周辺">レジ周辺</option>
            <option value="冷蔵ケース">冷蔵ケース</option>
            <option value="冷凍ケース">冷凍ケース</option>
            <option value="菓子・食品棚">菓子・食品棚</option>
            <option value="飲料コーナー">飲料コーナー</option>
            <option value="店頭">店頭</option>
            <option value="その他">その他</option>
        </select>

        <label>撤去期限</label>
        <input type="date" name="expire_date" value="{{ pop['expire_date'] }}" required>

        <button type="submit">
            編集内容を保存
        </button>

    </form>

    <br>

    <nav>
        <a href="/">🏠 ホーム</a>
        <a href="/list">📋 POP一覧</a>
        <a href="/register">➕ POP登録</a>
        <a href="/remove">📷 撤去確認</a>
    </nav>

</body>

</html>
