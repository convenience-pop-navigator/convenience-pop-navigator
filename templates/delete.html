<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>POP削除確認</title>
</head>

<body>

    <h1>コンビニPOP撤去ナビゲーター</h1>

    <h2>⚠️ POP削除確認</h2>

    <p>
        以下のPOPを削除しますか？
    </p>

    <h3>{{ pop["pop_name"] }}</h3>

    <p>JANコード：{{ pop["barcode"] }}</p>

    <p>設置場所：{{ pop["location"] }}</p>

    <br>

    <form method="POST">

        <button type="submit">
            🗑️ このPOPを削除する
        </button>

    </form>

    <br>

    <nav>
        <a href="/">🏠 ホーム</a>
        <a href="/list">📋 POP一覧</a>
        <a href="/register">➕ POP登録</a>
        <a href="/remove">📷 撤去確認</a>
    </nav>

</body>

</html>
