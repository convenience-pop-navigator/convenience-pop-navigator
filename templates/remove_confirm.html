<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>撤去確認</title>

</head>

<body>

    <h1>コンビニPOP撤去ナビゲーター</h1>

    <h2>撤去するPOPを確認</h2>

    <p>バーコードが一致しました。</p>

    {% if pop["image_path"] %}

    <img src="{{ url_for('static', filename='uploads/' + pop['image_path'].split('\\')[-1]) }}"
        style="width: 100%; max-width: 300px; border-radius: 10px;">

    {% endif %}

    <h3>{{ pop["pop_name"] }}</h3>

    <p>
        JANコード：{{ pop["barcode"] }}
    </p>

    <p>
        📍 設置場所：{{ pop["location"] }}
    </p>

    <p>
        このPOPを撤去しましたか？
    </p>

    <form method="POST" action="/remove/confirm/{{ pop['id'] }}">

        <button type="submit">
            ✅ このPOPを撤去完了にする
        </button>

    </form>

    <br>

    <a href="/remove">
        別のPOPを読み取る
    </a>

    <br><br>

    <nav>
        <a href="/">🏠 ホーム</a>
        <a href="/list">📋 POP一覧</a>
        <a href="/register">➕ POP登録</a>
        <a href="/remove">📷 撤去確認</a>
    </nav>

</body>

</html>
