<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>撤去確認</title>

</head>

<body>

    <h1>コンビニPOP撤去ナビゲーター</h1>

    <h2>📷 撤去確認</h2>

    <p>
        撤去するPOPのバーコードを読み取ってください。
    </p>


    <button type="button" id="scanButton">
        📷 バーコードを読み取る
    </button>


    <br><br>


    <video id="barcodeReader" width="100%" autoplay>
    </video>


    <br><br>


    <label>読み取ったJANコード</label>

    <input type="text" id="barcode" readonly>


    <br>


    <form method="POST" action="/remove/check">

        <input type="hidden" name="barcode" id="removeBarcode">

        <button type="submit">
            🔍 このバーコードを確認する
        </button>

    </form>


    <br><br>


    <nav>

        <a href="/">
            🏠 ホーム
        </a>

        <a href="/list">
            📋 POP一覧
        </a>

        <a href="/register">
            ➕ POP登録
        </a>

        <a href="/remove">
            📷 撤去確認
        </a>

    </nav>


    <script src="https://unpkg.com/@zxing/browser@latest"></script>


    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const scanButton =
                document.getElementById("scanButton");

            const barcodeInput =
                document.getElementById("barcode");

            const removeBarcode =
                document.getElementById("removeBarcode");


            scanButton.addEventListener("click", async () => {

                const codeReader =
                    new ZXingBrowser.BrowserMultiFormatReader();


                try {

                    const result =
                        await codeReader.decodeOnceFromVideoDevice(
                            undefined,
                            "barcodeReader"
                        );


                    barcodeInput.value =
                        result.text;


                    removeBarcode.value =
                        result.text;


                    alert(
                        "バーコードを読み取りました。\n" +
                        result.text
                    );


                } catch (error) {

                    console.error(error);

                    alert(
                        "バーコードを読み取れませんでした。"
                    );

                }

            });

        });

    </script>

</body>

</html>
