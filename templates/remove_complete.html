<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>撤去完了</title>

</head>

<body>

    <h1>コンビニPOP撤去ナビゲーター</h1>

    <h2>✅ 撤去完了</h2>

    <p>
        以下のPOPを撤去済みにしました。
    </p>

    <div class="pop-card">

        {% if pop["image_path"] %}

        <img src="{{ url_for('static', filename='uploads/' + pop['image_path'].split('\\')[-1]) }}"
            style="width: 100%; max-width: 300px; border-radius: 10px;">

        {% endif %}

        <h3>{{ pop["pop_name"] }}</h3>

        <p>
            📍 設置場所：{{ pop["location"] }}
        </p>

        <p>
            JANコード：{{ pop["barcode"] }}
        </p>

        <p>
            状態：✅ 撤去済み
        </p>

    </div>

    <a href="/remove">
        <button type="button">
            📷 次のPOPを撤去する
        </button>
    </a>

    <br><br>

    <a href="/list">
        <button type="button">
            📋 POP一覧を見る
        </button>
    </a>

    <br><br>

    <nav>

        <a href="/">
            🏠 ホーム
        </a>

        <a href="/list">
            📋 POP一覧
        </a>

        <a href="/register">
            ➕ POP登録
        </a>

        <a href="/remove">
            📷 撤去確認
        </a>

    </nav>

</body>

</html>
